# Ruff config. CI runs ruff in report-only mode (see the `lint` job in .github/workflows/ci.yml); nothing is enforced yet.
# Kept in its own file so adding it doesn't touch pyproject.toml while other pull requests are changing it.
line-length = 120
target-version = "py312"

[lint]
# Ruff's default rules (pycodestyle errors, pyflakes) plus import sorting. Long lines (E501) are not checked.
select = ["E4", "E7", "E9", "F", "I"]

apiVersion: v1
kind: Service
metadata:
  name: {{ include "pdg-mcp.fullname" . }}
  labels:
    {{- include "pdg-mcp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "pdg-mcp.selector" . | nindent 4 }}

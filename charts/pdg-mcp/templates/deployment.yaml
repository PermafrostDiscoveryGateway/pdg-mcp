apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pdg-mcp.fullname" . }}
  labels:
    {{- include "pdg-mcp.labels" . | nindent 4 }}
{{- $activeUsersPersistent := include "pdg-mcp.activeUsersPersistent" . }}
{{- if $activeUsersPersistent }}
{{- if not .Values.observability.userHashKeySecret }}
{{- fail "activeUsers.persistence.enabled needs observability.userHashKeySecret: without a stable key the server does not use the file" }}
{{- end }}
{{- if gt (int .Values.replicaCount) 1 }}
{{- fail "activeUsers.persistence.enabled supports replicaCount: 1 only (one SQLite file, one writer)" }}
{{- end }}
{{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if $activeUsersPersistent }}
  # The active-user volume is ReadWriteOnce: the old pod must let go of it before the new one starts.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "pdg-mcp.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pdg-mcp.selector" . | nindent 8 }}
      {{- if and .Values.metrics.enabled .Values.metrics.scrapeAnnotations }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        {{- if $activeUsersPersistent }}
        fsGroup: 10001  # lets the server write to the volume where the storage honors fsGroup
        {{- end }}
      containers:
        - name: pdg-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
            {{- if .Values.metrics.enabled }}
            # Not exposed by the Service or Ingress: only a scraper talking to the pod can reach it.
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          env:
            - name: ARCTICDATA_MCP_SERVER_HOST
              value: 0.0.0.0
            - name: ARCTICDATA_MCP_OBSERVABILITY_METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            - name: ARCTICDATA_MCP_OBSERVABILITY_METRICS_HOST
              value: 0.0.0.0
            - name: ARCTICDATA_MCP_OBSERVABILITY_METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            - name: ARCTICDATA_MCP_AUTH_REALM_URL
              value: {{ .Values.auth.realmUrl | quote }}
            - name: ARCTICDATA_MCP_AUTH_BASE_URL
              value: "https://{{ .Values.host }}"
            - name: ARCTICDATA_MCP_AUTH_AUDIENCE
              value: {{ .Values.auth.audience | quote }}
            - name: ARCTICDATA_MCP_AUTH_REQUIRED_ROLE
              value: {{ .Values.auth.requiredRole | quote }}
            - name: ARCTICDATA_MCP_AUTH_REQUIRED_SCOPES
              value: {{ .Values.auth.requiredScopes | quote }}
            {{- with .Values.observability.userHashKeySecret }}
            - name: ARCTICDATA_MCP_OBSERVABILITY_USER_HASH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            - name: ARCTICDATA_MCP_OBSERVABILITY_ACTIVE_USERS_ENABLED
              value: {{ .Values.activeUsers.enabled | quote }}
            - name: ARCTICDATA_MCP_OBSERVABILITY_ACTIVE_USERS_RETENTION_DAYS
              value: {{ .Values.activeUsers.retentionDays | quote }}
            {{- if $activeUsersPersistent }}
            - name: ARCTICDATA_MCP_OBSERVABILITY_ACTIVE_USERS_DB
              value: /data/active-users/active-users.sqlite
            {{- end }}
            {{- range $k, $v := .Values.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # The MCP endpoint answers 401 without a token, so probe the TCP port.
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- if $activeUsersPersistent }}
          volumeMounts:
            - name: active-users
              mountPath: /data/active-users
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if $activeUsersPersistent }}
      volumes:
        - name: active-users
          persistentVolumeClaim:
            claimName: {{ include "pdg-mcp.activeUsersClaimName" . }}
      {{- end }}

{{- if and .Values.metrics.enabled .Values.metrics.podMonitor.enabled }}
# Tells a Prometheus Operator (CRD monitoring.coreos.com) to scrape the pods' metrics port. The port is a container
# port only: the Service and Ingress do not route to it, which is why this targets pods and not a Service.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "pdg-mcp.fullname" . }}
  labels:
    {{- include "pdg-mcp.labels" . | nindent 4 }}
    {{- with .Values.metrics.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "pdg-mcp.selector" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.podMonitor.interval }}
{{- end }}

# pdg-chat: LibreChat for PDG users on software-dev (issue #30).
#
# Wraps the upstream chart (oci://ghcr.io/librechat-ai/librechat-chart/librechat, see Chart.yaml).
# Everything under `librechat:` is passed to that chart; see its values.yaml for all options.
# Install: see "Hosted chat (LibreChat)" in docs/admin-guide.md.
#
# Users sign in with the PDG Keycloak realm and bring their own model. LibreChat forwards each user's
# Keycloak access token to pdg-mcp, so they don't sign in twice. All secrets live in the
# librechat-credentials-env Secret, which is created by hand and never committed.

global:
  librechat:
    existingSecretName: librechat-credentials-env
  security:
    allowInsecureImages: true  # Bitnami charts require this when the image isn't docker.io/bitnami/*

librechat:
  image:
    tag: v0.8.9

  librechat:
    configEnv:
      DOMAIN_CLIENT: https://pdg-chat.software-dev.ncsa.illinois.edu
      DOMAIN_SERVER: https://pdg-chat.software-dev.ncsa.illinois.edu

      # Keycloak-only sign-in. Accounts are created on first login; the mcp-user realm role is the approval gate.
      ALLOW_EMAIL_LOGIN: "false"
      ALLOW_REGISTRATION: "false"
      ALLOW_PASSWORD_RESET: "false"
      ALLOW_SOCIAL_LOGIN: "true"
      ALLOW_SOCIAL_REGISTRATION: "true"

      OPENID_ISSUER: https://keycloak.software-dev.ncsa.illinois.edu/realms/PDG
      OPENID_CLIENT_ID: librechat
      OPENID_SCOPE: openid profile email
      OPENID_CALLBACK_URL: /oauth/openid/callback
      OPENID_BUTTON_LABEL: Sign in with PDG
      OPENID_REQUIRED_ROLE: mcp-user
      OPENID_REQUIRED_ROLE_TOKEN_KIND: access
      OPENID_REQUIRED_ROLE_PARAMETER_PATH: realm_access.roles
      # Keep and refresh the Keycloak tokens so {{LIBRECHAT_OPENID_ACCESS_TOKEN}} can be forwarded to pdg-mcp.
      OPENID_REUSE_TOKENS: "true"

      # No server-side model keys: built-in providers ask each user for their own key.
      OPENAI_API_KEY: user_provided
      ANTHROPIC_API_KEY: user_provided
      GOOGLE_KEY: user_provided
      # Lumen's OpenAI-compatible base URL (ends in /v1). Keys are handed out to selected users outside LibreChat.
      LUMEN_BASE_URL: https://<lumen-host>/v1

      # Conversation search. Meilisearch rebuilds its index from MongoDB, so it runs without a volume.
      SEARCH: "true"
      MEILI_NO_ANALYTICS: "true"

    configYamlContent: |
      version: 1.3.17
      cache: true

      registration:
        socialLogins: ["openid"]

      interface:
        mcpServers:
          use: true
          create: false
          share: false
          public: false

      endpoints:
        custom:
          - name: "Lumen"
            apiKey: "user_provided"
            baseURL: "${LUMEN_BASE_URL}"
            models:
              default: ["<lumen-model>"]
              fetch: true
            titleConvo: true
            titleModel: "current_model"
            modelDisplayLabel: "Lumen"
          - name: "Your own (OpenAI-compatible)"
            apiKey: "user_provided"
            baseURL: "user_provided"
            models:
              default: ["gpt-4o-mini"]
              fetch: true
            titleConvo: true
            titleModel: "current_model"
            modelDisplayLabel: "Your model"

      mcpServers:
        pdg:
          title: "PDG / Arctic Data Center"
          type: streamable-http
          # Public URL: LibreChat's SSRF guard blocks private addresses such as the in-cluster Service.
          url: https://pdg-mcp.software-dev.ncsa.illinois.edu/mcp
          # Forward the user's Keycloak token instead of starting pdg-mcp's own OAuth login.
          requiresOAuth: false
          headers:
            Authorization: "Bearer {{LIBRECHAT_OPENID_ACCESS_TOKEN}}"
          timeout: 120000

    # Uploaded images and files. NFS (cluster default), so it doesn't use Cinder quota.
    imageVolume:
      enabled: true
      size: 5Gi
      accessModes: ReadWriteOnce
      storageClassName: nfs-taiga

  ingress:
    enabled: true
    className: traefik
    # TLS comes from Traefik's letsencrypt cert resolver, not an Ingress tls Secret, so `tls` stays empty.
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
      traefik.ingress.kubernetes.io/router.middlewares: redirect-web-to-443@internal
    hosts:
      - host: pdg-chat.software-dev.ncsa.illinois.edu
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # Probes recommended by the LibreChat Helm docs (/health stays 200 even when dependencies are down).
  livenessProbe:
    httpGet:
      path: /livez
      port: 3080
  readinessProbe:
    httpGet:
      path: /readyz
      port: 3080

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1536Mi

  # MongoDB: Bitnami subchart with the bitnamilegacy image (Bitnami moved versioned tags there in Aug 2025).
  # Auth is on (chart 3.x default). The root password comes from mongodb-root-password in
  # librechat-credentials-env, and the chart builds MONGO_URI from it.
  mongodb:
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/mongodb
      tag: 8.0.13-debian-12-r0
    architecture: standalone
    auth:
      enabled: true
      existingSecret: librechat-credentials-env
    persistence:
      enabled: true
      storageClass: csi-cinder-sc-retain
      size: 2Gi
    resourcesPreset: none
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

  meilisearch:
    enabled: true
    persistence:
      enabled: false
    auth:
      existingMasterKeySecret: librechat-credentials-env
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

  redis:
    enabled: false

  librechat-rag-api:
    enabled: false

name: image
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
env:
  HUB_IMAGE: hub.ncsa.illinois.edu/pdg/pdg-mcp
  GHCR_IMAGE: ghcr.io/permafrostdiscoverygateway/pdg-mcp
jobs:
  # Lint, tests and chart checks (ci.yml). The image is only built and pushed if they pass.
  # This is the only place ci.yml runs on PRs/pushes: don't add `paths:` filters to this workflow's triggers or
  # disable it, or CI stops running. The required status checks are "ci / test", "ci / lint" and "ci / chart";
  # renaming this job changes those names and breaks branch protection.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Pull requests only build. Pushes go to NCSA Harbor (needs HUB_USERNAME/HUB_PASSWORD secrets, e.g. a
      # Harbor robot account with push access to the pdg project) and to ghcr.io.
      - id: push
        env:
          HUB_USERNAME: ${{ secrets.HUB_USERNAME }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$HUB_USERNAME" ]; then echo "hub=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.push.outputs.hub == 'true'
        uses: docker/login-action@v3
        with:
          registry: hub.ncsa.illinois.edu
          username: ${{ secrets.HUB_USERNAME }}
          password: ${{ secrets.HUB_PASSWORD }}
      - if: steps.push.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            name=${{ env.HUB_IMAGE }},enable=${{ steps.push.outputs.hub == 'true' }}
            name=${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.push.outputs.enabled == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

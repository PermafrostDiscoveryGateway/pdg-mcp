# Optional local hooks: `uvx pre-commit install` (or `pip install pre-commit && pre-commit install`).
# CI runs the same ruff checks, so the hooks only catch problems earlier.
# Keep `rev` equal to the ruff pin in pyproject.toml (`uv run ruff --version`). Dependabot opens ruff bumps as their own
# PR; in that PR, bump `rev` to match and run `uv run ruff format .` so local hooks and CI format the same way.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lake time series</title>
<!--
  Mirrors the water-timeseries dashboard's time series section (map_viewer.py): the
  figures are the ones DWDataset/JRCDataset.plot_timeseries_interactive build, exported
  as Plotly JSON by scripts/export_water_fixtures.py, so this page only renders them.
-->
<style>
  html, body { margin: 0; background: #fff; font: 13px/1.4 system-ui, sans-serif; color: #222; }
  h1 { font-size: 15px; margin: 0; padding: 8px 10px 2px; }
  h2 { font-size: 14px; margin: 8px 10px 0; }
  #meta { color: #555; padding: 0 10px 4px; }
  .plot { width: 100%; }
  .actions { display: flex; gap: 8px; padding: 2px 10px 8px; flex-wrap: wrap; }
  button { font-size: 12px; padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; }
  button:hover { background: #f3f3f3; }
  .caption { color: #666; font-size: 12px; padding: 0 10px 8px; }
</style>
</head>
<body>
<h1 id="title">Waiting for time series…</h1>
<div id="meta"></div>
<div id="dw" class="plot"></div>
<div class="actions" id="dw-actions"></div>
<section id="jrc-section" hidden>
  <h2>JRC</h2>
  <div id="jrc" class="plot"></div>
  <div class="actions" id="jrc-actions"></div>
</section>
<div class="caption" id="jrc-missing" hidden>JRC data not available for this feature</div>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@4.1.1/plotly.min.js"></script>
<script type="module">
  import { App } from "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps@2.0.3/dist/src/app-with-deps.js";

  const $ = (id) => document.getElementById(id);
  const fmt = (v) => (v == null ? "N/A" : Number(v).toFixed(2));
  const app = new App({ name: "water-lake-timeseries", version: "0.2.0" });

  // Same file the dashboard's "Save Interactive Plot (HTML)" button produces
  // (fig.to_html(include_plotlyjs="cdn")), built from the figure JSON.
  function figureHtml(fig, title) {
    const json = JSON.stringify(fig).replace(/</g, "\\u003c");
    return `<!doctype html><html><head><meta charset="utf-8"><title>${title}</title>` +
      '<script src="https://cdn.plot.ly/plotly-4.1.1.min.js"><\/script></head><body>' +
      `<div id="plot"></div><script>const f=${json};Plotly.newPlot("plot",f.data,f.layout,{responsive:true});<\/script>` +
      "</body></html>";
  }

  function addSaveButton(container, fig, lakeId, prefix) {
    if (!app.getHostCapabilities()?.downloadFile) return;
    const btn = document.createElement("button");
    btn.textContent = `💾 Save ${prefix ? prefix.toUpperCase() + " " : ""}Interactive Plot (HTML)`;
    const name = `timeseries_${prefix ? prefix + "_" : ""}${lakeId}.html`;
    btn.onclick = () => app.downloadFile({
      contents: [{ type: "resource", resource: { uri: `file:///${name}`, mimeType: "text/html", text: figureHtml(fig, name) } }],
    });
    container.appendChild(btn);
  }

  app.ontoolresult = ({ structuredContent: d }) => {
    if (!d?.dw?.figure) {
      $("title").textContent = "No time series in the tool result.";
      return;
    }
    $("title").textContent = `📈 Time Series Plot of Lake: ${d.name ?? d.lake_id}`;
    const b = d.break;
    $("meta").textContent = b
      ? `Break ${b.date_break.slice(0, 7)} · water area before ${fmt(b.pre_break_median)} ha, after ${fmt(b.post_break_median)} ha`
      : "No drainage break detected";

    Plotly.newPlot("dw", d.dw.figure.data, d.dw.figure.layout, { responsive: true, displaylogo: false });
    addSaveButton($("dw-actions"), d.dw.figure, d.lake_id, "");
    const explain = document.createElement("button");
    explain.textContent = "Ask Claude to explain this series";
    explain.onclick = () => app.sendMessage({
      role: "user",
      content: [{ type: "text", text:
        `Explain the water area time series of lake ${d.lake_id}: the trend, the detected break (if any), ` +
        "and how the vegetation and bare areas change around it." }],
    });
    $("dw-actions").appendChild(explain);

    if (d.jrc?.figure) {
      $("jrc-section").hidden = false;
      Plotly.newPlot("jrc", d.jrc.figure.data, d.jrc.figure.layout, { responsive: true, displaylogo: false });
      addSaveButton($("jrc-actions"), d.jrc.figure, d.lake_id, "jrc");
    } else {
      $("jrc-missing").hidden = false;
    }
  };

  await app.connect();
</script>
</body>
</html>

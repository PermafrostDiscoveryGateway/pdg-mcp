replicaCount: 1

# Defaults to NCSA Harbor (pdg project). Override repository/tag to use another registry,
# e.g. repository: ghcr.io/permafrostdiscoverygateway/pdg-mcp
image:
  repository: hub.ncsa.illinois.edu/pdg/pdg-mcp
  # defaults to the chart appVersion
  tag: ""
  # Always: the tag is reused across pushes (e.g. 0.1.0), so a node's cached copy would otherwise go stale.
  pullPolicy: Always

# The pdg Harbor project is private: name a kubernetes.io/dockerconfigjson Secret in this namespace, e.g. [ncsa-hub]
imagePullSecrets: []

# Public hostname; also used as the OAuth base URL (https://<host>)
host: pdg-mcp.software-dev.ncsa.illinois.edu

# Keycloak (per-user login). Users need the realm role below, granted by an admin.
auth:
  realmUrl: https://keycloak.software-dev.ncsa.illinois.edu/realms/PDG
  audience: ""
  requiredRole: mcp-user
  requiredScopes: openid

# Extra ARCTICDATA_MCP_* settings, e.g. ARCTICDATA_MCP_DOWNLOADS_MAX_INLINE_BYTES: "10485760".
# Rate limits are enforced per pod, so with replicaCount > 1 the effective limits multiply. Example:
#   ARCTICDATA_MCP_RATELIMIT_MAX_CONCURRENT: "6"
#   ARCTICDATA_MCP_RATELIMIT_PER_USER_RATE: "2"
#   ARCTICDATA_MCP_RATELIMIT_PER_USER_BURST: "20"
# The metadata document cache should follow resources.limits.memory (about 6 bytes per cached character once parsed):
#   ARCTICDATA_MCP_METADATA_CACHE_MAX_CHARS: "20000000"
extraEnv: {}

service:
  port: 8000

ingress:
  enabled: true
  className: ""
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: redirect-web-to-443@internal

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

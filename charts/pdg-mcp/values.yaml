replicaCount: 1

# Defaults to NCSA Harbor (pdg project). Override repository/tag to use another registry,
# e.g. repository: ghcr.io/permafrostdiscoverygateway/pdg-mcp
image:
  repository: hub.ncsa.illinois.edu/pdg/pdg-mcp
  # defaults to the chart appVersion
  tag: ""
  # Always: the tag is reused across pushes (e.g. 0.1.0), so a node's cached copy would otherwise go stale.
  pullPolicy: Always

# The pdg Harbor project is private: name a kubernetes.io/dockerconfigjson Secret in this namespace, e.g. [ncsa-hub]
imagePullSecrets: []

# Public hostname; also used as the OAuth base URL (https://<host>)
host: pdg-mcp.software-dev.ncsa.illinois.edu

# Keycloak (per-user login). Users need the realm role below, granted by an admin.
auth:
  realmUrl: https://keycloak.software-dev.ncsa.illinois.edu/realms/PDG
  audience: ""
  requiredRole: mcp-user
  requiredScopes: openid

# Usage logging. userHashKeySecret names a Secret key holding the HMAC key that hashes Keycloak user IDs in logs;
# keep it identical across pods and do not rotate it casually. Empty = a random key per process (a warning is
# logged): hashes change on restart and differ between pods, so per-user counts over time are unreliable.
observability:
  userHashKeySecret: {}   # e.g. {name: pdg-mcp-observability, key: user-hash-key}

# Active users (pdg_mcp_active_users: today, this month, rolling 7 and 30 days). The server keeps one row per
# hashed user per UTC day in a small SQLite file and exports only the counts. Without persistence the file is not
# used and counts restart at zero whenever the pod does. persistence.enabled mounts a volume for it; that needs
# observability.userHashKeySecret (hashes from a random key cannot be matched after a restart), allows one replica
# only, and switches the Deployment to the Recreate strategy so the old pod lets go of the volume first.
# retentionDays (minimum 31) is how long the hashed rows are kept; long-term numbers live in the report archive.
activeUsers:
  enabled: true
  retentionDays: 35
  persistence:
    enabled: false
    existingClaim: ""    # use a claim you created yourself instead of the chart's
    size: 100Mi          # a row is ~30 bytes; this holds far more users than the service will have
    accessMode: ReadWriteOnce
    storageClassName: "" # empty = the cluster's default storage class. Prefer block storage: SQLite on NFS is unsafe

# Prometheus metrics (/metrics). Served on their own pod port, which the Service and Ingress do not expose, so
# they are reachable only from inside the cluster by scraping the pod. scrapeAnnotations adds the conventional
# prometheus.io/* pod annotations; drop them if your Prometheus discovers targets another way.
#
# podMonitor creates a Prometheus Operator PodMonitor, which is how an Operator-based Prometheus (for example
# Rancher Monitoring) finds the pods: it ignores the annotations above. Leave it off on clusters without the
# monitoring.coreos.com CRDs, or the install fails. `labels` are extra labels for the PodMonitor, needed only if
# your Prometheus has a podMonitorSelector (empty selector = it picks up every PodMonitor, no labels needed).
metrics:
  enabled: true
  port: 9100
  scrapeAnnotations: true
  podMonitor:
    enabled: false
    interval: 30s
    labels: {}

# Grafana dashboard ("PDG MCP Usage") as a ConfigMap, for Grafana's dashboard sidecar to load. Off by default.
# `namespace` is where the sidecar looks for dashboards, which is normally NOT this release's namespace. The default,
# cattle-dashboards, is what the software-dev Grafana watches (verified 2026-11-17; on another cluster check the
# sidecar's NAMESPACE and LABEL settings, see the admin guide). Empty = the release namespace. `labels` are merged
# into the ConfigMap's labels. `annotations` only matter if the sidecar has a FOLDER_ANNOTATION setting (the
# software-dev one does not, so the dashboard lands in the "General" folder there).
grafana:
  dashboard:
    enabled: false
    namespace: cattle-dashboards
    labels:
      grafana_dashboard: "1"
    annotations: {}

# Daily archive of usage numbers. Prometheus only keeps data for its retention period (10 days on software-dev),
# so this CronJob saves each finished UTC day to a persistent volume as usage-YYYY-MM-DD.json plus daily-summary.csv
# and daily-tools.csv (counts only; distinct users cannot be added up across days). Off by default: it needs the
# metrics scraped by a Prometheus and a volume. `days` is how many previous days each run checks, so a missed run
# is caught up. `schedule` is in the cluster controller's timezone (normally UTC); days are always UTC days.
report:
  enabled: false
  schedule: "15 1 * * *"
  days: 3
  prometheusUrl: http://rancher-monitoring-prometheus.cattle-monitoring-system:9090
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 128Mi}
  persistence:
    existingClaim: ""    # use a claim you created yourself instead of the chart's
    size: 1Gi            # the archive grows by well under 100 KB a day
    accessMode: ReadWriteOnce
    storageClassName: "" # empty = the cluster's default storage class
    pv:
      enabled: false     # true = also create a static PersistentVolume (cluster-scoped) and bind the claim to it
      source: {}         # volume backend, e.g.  nfs: {server: nfs.example.org, path: /exports/pdg-mcp-usage}

# Extra ARCTICDATA_MCP_* settings, e.g. ARCTICDATA_MCP_DOWNLOADS_MAX_INLINE_BYTES: "10485760".
# Rate limits are enforced per pod, so with replicaCount > 1 the effective limits multiply. Example:
#   ARCTICDATA_MCP_RATELIMIT_MAX_CONCURRENT: "6"
#   ARCTICDATA_MCP_RATELIMIT_PER_USER_RATE: "2"
#   ARCTICDATA_MCP_RATELIMIT_PER_USER_BURST: "20"
# The metadata document cache should follow resources.limits.memory (about 6 bytes per cached character once parsed):
#   ARCTICDATA_MCP_METADATA_CACHE_MAX_CHARS: "20000000"
extraEnv: {}

service:
  port: 8000

ingress:
  enabled: true
  className: ""
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: redirect-web-to-443@internal

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

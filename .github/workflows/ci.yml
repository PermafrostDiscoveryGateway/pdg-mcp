name: ci
# Reusable workflow: called from image.yml so that the image build can `needs:` it. It has no triggers of its own,
# which keeps tests from running twice on a pull request.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      # Live tests (-m live) are deselected by pyproject.toml; they run weekly in live.yml instead.
      - run: uv run pytest
  # Report-only: findings show up in the logs and as annotations, but never fail the workflow or block the image build.
  # Config is in ruff.toml. Make these steps blocking (drop continue-on-error) once the code has been reformatted.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.17.4 check --output-format=github .
        continue-on-error: true
      - run: uvx ruff@0.17.4 format --check --diff .
        continue-on-error: true
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: helm lint charts/pdg-mcp
      - run: helm template charts/pdg-mcp > /dev/null

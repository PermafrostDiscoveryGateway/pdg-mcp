# Copy to config.toml and edit. config.toml is git-ignored.
# Every value can be overridden by an environment variable named
# ARCTICDATA_MCP_<SECTION>_<KEY>, e.g. ARCTICDATA_MCP_AUTH_REALM_URL.

[auth]
# Per-user login through Keycloak. Create a realm and a client there, then point at the realm.
realm_url = "https://keycloak.software-dev.ncsa.illinois.edu/realms/PDG"
# Public URL clients use to reach this server (no path); used for OAuth discovery metadata.
base_url = "http://127.0.0.1:8000"
# Expected "aud" claim in the access token (add an audience mapper to the client). Empty = not checked.
audience = ""
required_scopes = ["openid"]
# Realm role an admin grants to approve a self-registered user. Empty = any realm user is allowed.
required_role = "mcp-user"

[server]
transport = "http"      # "http" (Keycloak-protected) or "stdio" (local, no auth)
host = "127.0.0.1"      # use 0.0.0.0 to listen on all interfaces
port = 8000
path = "/mcp"

[arcticdata]
base_url = "https://arcticdata.io/metacat/d1/mn/v2"
cn_url = "https://cn.dataone.org/cn/v2"
catalog_url = "https://arcticdata.io/catalog/view"
timeout = 60.0

[downloads]
# Files up to this size are returned inline to the agent; larger files return a URL.
max_inline_bytes = 10485760
# Allow tools to save files on the MCP server's own disk (delivery="server").
allow_server_save = false
download_dir = "./downloads"

[profile]
# profile_file: bytes read in scan="sample" mode, and the most bytes read in scan="full" mode.
sample_bytes = 5242880
max_full_bytes = 104857600
# Columns profiled per file, rows parsed per chunk, distinct text values tracked per column, top values reported.
max_columns = 500
chunk_rows = 100000
max_distinct = 1000
top_values = 5
# Numeric codes counted as missing (and excluded from min/max/mean).
sentinels = ["-9999", "-99999"]
# Rasters: blocks read in scan="sample" mode (spread over the image) and the pixels each window is grown to;
# pixels (times bands) read in scan="full" mode, beyond which the raster is sampled.
sample_blocks = 16
sample_block_pixels = 65536
max_full_pixels = 25000000
# NetCDF: values read per variable in scan="sample" mode, and in total in scan="full" mode.
sample_values = 20000
max_full_values = 50000000
# Seconds a raster or NetCDF profile may take before it is abandoned.
timeout = 120.0

[ratelimit]
# ADC does not rate-limit on its side, so these limits are the only thing protecting it from overload.
# Global cap on requests in flight to arcticdata.io across all users (0 = unlimited).
max_concurrent = 6
# Seconds a request waits for a free slot before the tool call fails.
queue_timeout = 30.0
# Per-user token bucket keyed on the Keycloak "sub" claim: sustained tool calls per second
# (0 = unlimited) and how many calls a user can make back-to-back before that rate applies.
per_user_rate = 2.0
per_user_burst = 20
# Retry on 429/502/503/504 with exponential backoff (Retry-After header wins when present).
max_retries = 3
retry_backoff = 1.0
retry_max_delay = 30.0

[water]
# Lake data for the water-timeseries MCP Apps PoC (show_lakes, get_lake_timeseries): a directory with
# lakes.geojson and timeseries.json written by scripts/export_water_fixtures.py. Empty = bundled fixtures.
data_dir = ""

[portals]
# Project portals (search_portals, get_portal, search_portal_datasets, find_portals_for_dataset).
portal_url = "https://arcticdata.io/catalog/portals"
# Seconds to cache the portal list and each portal's dataset count (0 = refetch on every call).
cache_ttl = 3600.0
# Labels of portals to hide, e.g. test or spam portals.
exclude_labels = []

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # Updates uv.lock (and the pyproject.toml constraints). Grouped and capped so the first run doesn't open a pile of
  # PRs; expect uv.lock conflicts with open PRs, which `uv lock` resolves. Live tests don't run on these PRs, so check
  # that fastmcp bumps still work.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-dependencies:
        patterns: ["*"]
